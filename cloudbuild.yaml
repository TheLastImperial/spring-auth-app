
availableSecrets:
  secretManager:
    - versionName: projects/838869213505/secrets/GITHUB_MAVEN_USER/versions/latest
      env: 'GITHUB_MAVEN_USER'
    - versionName: projects/838869213505/secrets/GITHUB_MAVEN_PASSWORD/versions/latest
      env: 'GITHUB_MAVEN_PASSWORD'

steps:
  - name: 'ubuntu'
    id: 'settings.xml'
    secretEnv: ['GITHUB_MAVEN_USER', 'GITHUB_MAVEN_PASSWORD']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cat > settings.xml << EOF
        <settings>
          <servers>
            <server>
              <id>github</id>
              <username>$$GITHUB_MAVEN_USER</username>
              <password>$$GITHUB_MAVEN_PASSWORD</password>
            </server>
          </servers>
        </settings>
        EOF

  - name: 'maven:3.9.6-eclipse-temurin-21'
    entrypoint: 'mvn'
    args: ['clean', '--settings', 'settings.xml', 'package', '-DskipTests']
    id: 'build-jar'

artifacts:
  objects:
    location: 'gs://${_BUCKET_NAME}/builds/$BUILD_ID'
    paths:
      - 'target/authapp-0.0.11.jar'

substitutions:
  _BUCKET_NAME: 'authapp_bucket'

options:
  logging: CLOUD_LOGGING_ONLY
